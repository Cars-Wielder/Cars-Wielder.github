			#box {

				position: absolute;

			}
			@keyframes rainbow {

    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}





		</style>

	</head>

}
